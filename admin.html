<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>NDAWX · Owner moderation</title><style>body{background:#190b0e;color:#fff2df;font:16px/1.5 system-ui;margin:0}main{max-width:850px;margin:40px auto;padding:20px}a{color:#f3d58a}input,select,button{background:#35121c;color:#fff2df;border:1px solid #895564;padding:10px;border-radius:6px;font:inherit}input{display:block;width:95%;margin:10px 0}button{cursor:pointer;margin:5px}.card{border:1px solid #895564;padding:16px;margin:14px 0;border-radius:8px}.body{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#c8b6b2}label{display:block}#status{color:#f3d58a}[hidden]{display:none!important}</style></head><body><main><a href="index.html#community">← NDAWX</a><h1>Owner moderation</h1><p class="muted">Guest comments publish immediately. Remove abusive posts here or restore removed posts. Your owner key stays in this tab’s memory and is cleared when you lock or close the page.</p><form id="login"><label>Forum Worker origin<input id="api" type="url" required placeholder="https://ndawx-forum.your-account.workers.dev"></label><label>Owner key<input id="key" type="password" autocomplete="off" minlength="32" required></label><button>Unlock moderation</button></form><p id="status" role="status"></p><section id="tools" hidden><select id="filter" aria-label="Comment status"><option value="approved">Published</option><option value="rejected">Removed</option><option value="pending">Legacy pending</option></select><button id="reload">Refresh</button><button id="lock">Lock</button><div id="list"></div><button id="more" hidden>Older posts</button></section></main><script>
(()=>{const el=id=>document.getElementById(id);let origin='',secret='',next=null,busy=false,session=0;const message=t=>el('status').textContent=t;const n=(tag,text)=>{const x=document.createElement(tag);x.textContent=text;return x};
async function api(path,opts={}){const r=await fetch(origin+path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+secret,...opts.headers},signal:AbortSignal.timeout(20000)});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(append=false){if(busy)return;busy=true;const ticket=session;try{const data=await api('/admin/comments?status='+el('filter').value+(append&&next?'&before='+next:''));if(ticket!==session)return;if(!append)el('list').replaceChildren();for(const c of data.comments){const box=n('article','');box.className='card';box.append(n('strong',c.name+' · #'+c.id+(c.parent_id?' · reply to #'+c.parent_id:'')),n('small',' · '+new Date(c.created_at*1000).toLocaleString()));const body=n('p',c.body);body.className='body';box.append(body);for(const [label,state]of [['Publish / restore','approved'],['Remove','rejected']]){if(c.status===state)continue;const b=n('button',label);b.onclick=async()=>{b.disabled=true;try{await api('/admin/comments/'+c.id,{method:'PATCH',body:JSON.stringify({status:state})});box.remove();message('Updated comment #'+c.id+'.')}catch(e){message(e.message);b.disabled=false}};box.append(b)}el('list').append(box)}next=data.nextBefore;el('more').hidden=!next;el('tools').hidden=false;el('login').hidden=true;message(data.comments.length?'Comments loaded.':'No posts in this category.')}catch(e){message(e.message)}finally{busy=false}}
el('login').onsubmit=e=>{e.preventDefault();try{const u=new URL(el('api').value);if(u.protocol!=='https:'||u.pathname!=='/'||u.search||u.hash||u.username||u.password)throw Error('Use the HTTPS Worker origin only.');origin=u.origin;secret=el('key').value;el('key').value='';load()}catch(e){message(e.message)}};el('filter').onchange=()=>load();el('reload').onclick=()=>load();el('more').onclick=()=>load(true);el('lock').onclick=()=>{session++;secret='';el('list').replaceChildren();el('tools').hidden=true;el('login').hidden=false;message('Locked.')};})();
</script></body></html>
